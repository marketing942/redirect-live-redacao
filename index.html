<head>

  <meta charset="UTF-8">

  <title>Live de Redação | CPPEM</title>
  <meta name="description" content="Entre no grupo do WhatsApp da live de redação com a Prof.ª Shayenne: sexta-feira, às 19h30.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="public/favicon-192.png" type="image/png">

  <!-- Sem JavaScript, o próprio navegador faz o redirecionamento no mesmo tempo da contagem. -->
  <noscript><meta http-equiv="refresh" content="5;url=https://links.cppem.com.br/gp-lv-rd"></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#AF9256;--gold-light:#C9AE7A;--gold-pale:#F0DCB0;--bg:#0A0A0B;--text:#E8E4D9;--soft:#ADA99B;--mute:#87847A;--border:rgba(175,146,86,.18);--border-active:rgba(175,146,86,.55);--wa:#25D366}
    html{background:var(--bg)}
    body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(900px 460px at 90% 0%,rgba(175,146,86,.08),transparent 65%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    header{display:flex;justify-content:center;align-items:center;height:84px;border-bottom:1px solid var(--border);background:rgba(10,10,11,.9)}
    header img{width:130px;height:auto}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.5rem 1rem}
    .eyebrow{display:flex;align-items:center;gap:.75rem;color:var(--gold-light);font:700 .78rem/1 Rajdhani,sans-serif;letter-spacing:.18em;text-transform:uppercase}
    .eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--gold)}
    h1{margin-top:.9rem;max-width:24ch;font:700 clamp(1.6rem,4.5vw,2.5rem)/1.1 Oxanium,sans-serif;letter-spacing:-.02em;text-transform:uppercase}
    .when{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.2rem}
    .chip{padding:.5rem .9rem;border:1px solid var(--border-active);border-radius:.5rem;background:rgba(175,146,86,.08);color:var(--gold-pale);font:700 1rem/1 Rajdhani,sans-serif;letter-spacing:.06em;text-transform:uppercase}
    .prof{display:flex;align-items:center;gap:.8rem;margin-top:1.4rem;color:var(--soft);font-size:.95rem;text-align:left}
    .prof img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--border-active)}
    .prof strong{display:block;color:var(--text)}
    .countdown{position:relative;display:grid;place-items:center;width:150px;height:150px;margin:2rem 0 1rem}
    .countdown svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .track{fill:rgba(175,146,86,.06);stroke:var(--border);stroke-width:6}
    .bar{fill:none;stroke:var(--gold-light);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
    .num{position:relative;display:grid;place-items:center;color:var(--gold-pale);font:800 4.2rem/1 Oxanium,sans-serif;font-variant-numeric:tabular-nums}
    .num svg{position:static;width:56px;height:56px;transform:none;color:var(--wa)}
    .txt{color:var(--soft);font-size:1.05rem}
    footer{padding:1.2rem 1rem;border-top:1px solid var(--border);color:var(--mute);font-size:.8rem;text-align:center;background:#050506}
    @media (prefers-reduced-motion:reduce){.bar{transition:none}}
  </style>
</head>
<body>
  <noscript><iframe src="https://sgtm.cppem.com.br/ns.html?id=GTM-PJ379FLQ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header><img src="public/logo-cppem.png" alt="CPPEM Concursos Públicos" width="700" height="239"></header>

  <main>
    <span class="eyebrow">Live gratuita</span>
    <h1>Você será direcionado para o grupo da live de redação</h1>

    <div class="when">
      <span class="chip">Sexta-feira</span>
      <span class="chip">às 19h30</span>
    </div>

    <div class="prof">
      <img src="public/shayenne.webp" alt="Prof.ª Shayenne" width="56" height="56">
      <span><strong>Prof.ª Shayenne</strong>Live de Redação CPPEM</span>
    </div>

    <div class="countdown" role="timer" aria-live="off">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" class="track"/>
        <circle cx="60" cy="60" r="54" class="bar" id="bar"/>
      </svg>
      <span class="num" id="num">5</span>
    </div>
    <p class="txt" id="txt" aria-live="polite">Abrindo o grupo do WhatsApp em 5 segundos…</p>

  </main>

  <footer>© <span id="year">2026</span> CPPEM Concursos Públicos</footer>

  <script>
  (function () {
    "use strict";
    /* ===== CONFIGURAÇÃO =====
       DESTINO: link do redirecionador links.cppem.com.br apontando para o grupo do WhatsApp
       (trocar o grupo lá, sem novo deploy). Se mudar o slug, ajuste também o <noscript> e o botão acima. */
    var DESTINO = "https://links.cppem.com.br/gp-lv-rd";
    var SEGUNDOS = 5;

    var WA = '<svg width="56" height="56" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';

    var num = document.getElementById("num"), txt = document.getElementById("txt"),
        bar = document.getElementById("bar");
    document.getElementById("year").textContent = new Date().getFullYear();

    /* Repassa UTMs/ids de clique para o redirecionador (mantém a origem da campanha). */
    var PASSA = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","src","sck","fbclid","gclid"];
    var params = new URLSearchParams(location.search);
    var url = new URL(DESTINO);
    PASSA.forEach(function (k) { var v = params.get(k); if (v) url.searchParams.set(k, v); });
    var destino = url.toString();

    var R = 2 * Math.PI * 54;
    bar.setAttribute("stroke-dasharray", R);
    bar.setAttribute("stroke-dashoffset", R);

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: "live_redacao_view" });

    var enviado = false;
    function sair() {
      if (enviado) return; enviado = true;
      window.dataLayer.push({ event: "live_redacao_redirect" });
      /* location.replace: o botão "Voltar" não cai de novo nesta página. */
      setTimeout(function () { location.replace(destino); }, 150);
    }

    /* O tempo vem do relógio (não de "-1 por segundo"), então não atrasa com a aba em segundo plano. */
    var fim = Date.now() + SEGUNDOS * 1000;
    var id = setInterval(function () {
      var ms = fim - Date.now();
      var left = Math.max(0, Math.ceil(ms / 1000));
      bar.setAttribute("stroke-dashoffset", R * (1 - (SEGUNDOS - left) / SEGUNDOS));
      if (left > 0) {
        num.textContent = left;
        txt.textContent = "Abrindo o grupo do WhatsApp em " + left + (left === 1 ? " segundo…" : " segundos…");
      } else {
        num.innerHTML = WA;
        txt.textContent = "Abrindo o WhatsApp…";
      }
      if (ms <= 0) { clearInterval(id); sair(); }
    }, 200);
  })();
  </script>
</body>
</html>
